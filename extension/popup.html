<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        width: 320px;
        padding: 16px;
        background: #0f0f23;
        color: #e0e0e0;
      }
      h1 {
        font-size: 16px;
        margin-bottom: 12px;
        color: #e94560;
      }
      .status {
        font-size: 12px;
        padding: 8px;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      .status.ok {
        background: #1a3a1a;
        color: #4ade80;
      }
      .status.warn {
        background: #3a2a1a;
        color: #fbbf24;
      }
      .status.err {
        background: #3a1a1a;
        color: #f87171;
      }
      label {
        font-size: 12px;
        display: block;
        margin-bottom: 4px;
        color: #999;
      }
      input {
        width: 100%;
        padding: 8px;
        border: 1px solid #333;
        border-radius: 6px;
        background: #1a1a2e;
        color: #fff;
        font-size: 13px;
        margin-bottom: 8px;
      }
      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: #e94560;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.secondary {
        background: transparent;
        border: 1px solid #333;
        color: #999;
      }
      .result {
        font-size: 12px;
        margin-top: 8px;
        padding: 6px;
        border-radius: 4px;
      }
      .result.ok {
        background: #1a3a1a;
        color: #4ade80;
      }
      .result.err {
        background: #3a1a1a;
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <h1>TabelhaFin</h1>
    <div id="status" class="status warn">Verificando...</div>
    <div id="appUrl-group" style="margin-bottom: 8px">
      <label for="appUrl">URL do TabelhaFin</label>
      <input id="appUrl" placeholder="https://tabelhafin..workers.dev" />
    </div>
    <div id="device-group" style="margin-bottom: 12px">
      <label for="deviceToken">Device Token (gerado no app)</label>
      <input id="deviceToken" placeholder="Cole o token de pareamento" />
    </div>
    <button id="pairBtn">Parear</button>
    <button id="refreshBtn" class="secondary" style="margin-top: 6px">
      Atualizar status
    </button>
    <div id="result"></div>
    <script src="popup.js"></script>
  </body>
</html>
